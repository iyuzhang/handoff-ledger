[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-ledger"
version = "1.0.0"
description = "An evidence-backed service handoff workbench with human sign-off"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]

[project.scripts]
handoff-ledger = "handoff_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/iyuzhang/handoff-ledger"
Issues = "https://github.com/iyuzhang/handoff-ledger/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["handoff_ledger"]
namespaces = false

[tool.setuptools.package-data]
handoff_ledger = ["py.typed", "static/*"]
